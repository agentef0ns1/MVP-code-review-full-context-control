[project]
name = "mvp-memory-context"
version = "0.2.0"
description = "Local MCP server with external persistent memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
semantic = [
    "numpy>=2.0.0",
]

[project.scripts]
mvp-memory-mcp = "mvp_memory.mcp_server:main"
mvp-memory-api = "mvp_memory.api.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mvp_memory = ["prompts/*.md", "audit_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
